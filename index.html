    /* Settings row */
    .srow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 8px;

    .badge {
      background: linear-gradient(135deg,#A855F7,#EC4899);

      border-radius: 50%;

      padding: 0 4px;
      flex-shrink: 0;

    /* Toggle */
    .toggle {
      width: 44px; height: 24px;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle-thumb {
      position: absolute;
      top: 2px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: left 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
  </style>
</head>

// ── UTILS ────────────────────────────────────────────────────
const fmtT=d=>{try{const dt=d?.toDate?d.toDate():new Date(d);if(isNaN(dt))return"";return dt.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});}catch{return"";}};
const fmtD=d=>{try{const dt=d?.toDate?d.toDate():new Date(d);if(isNaN(dt))return"";const diff=new Date()-dt;if(diff<86400000)return fmtT(d);if(diff<172800000)return"Kemarin";return dt.toLocaleDateString("id-ID",{day:"2-digit",month:"short"});}catch{return"";}};
const ini=n=>(n||"?").split(" ").map(x=>x[0]).join("").toUpperCase().slice(0,2);
const normPhone=p=>{let n=p.replace(/[\s\-().]/g,"").trim();if(n.startsWith("+"))n=n.slice(1);return n;};
const allFmts=p=>{const n=normPhone(p);const s=new Set([n]);if(n.startsWith("62")){s.add("0"+n.slice(2));}else if(n.startsWith("08")){s.add("62"+n.slice(1));}else if(n.startsWith("8")&&n.length>=9){s.add("0"+n);s.add("62"+n);}return Array.from(s);};
const cid=(a,b)=>[a,b].sort().join("__");

// ── FB OPS ───────────────────────────────────────────────────
const fsSave=async(col,id,data)=>{const{doc,setDoc}=window._fs;await setDoc(doc(window._db,col,id),data,{merge:true});};
const fsGet=async(col,id)=>{const{doc,getDoc}=window._fs;const s=await getDoc(doc(window._db,col,id));return s.exists()?{id:s.id,...s.data()}:null;};
const fsFind=async(phone)=>{
  const{collection,query,where,getDocs}=window._fs;
  for(const fmt of allFmts(phone)){
    const q=query(collection(window._db,"users"),where("phone","==",fmt));
    const s=await getDocs(q);
    if(!s.empty){const d=s.docs[0];return{uid:d.id,...d.data()};}
  }
  return null;
};
const fsOnline=async(uid,online)=>{try{const{doc,updateDoc,serverTimestamp}=window._fs;await updateDoc(doc(window._db,"users",uid),{online,lastSeen:serverTimestamp()});}catch(e){}};
const uploadImg=async(path,dataUrl)=>{
  if(!dataUrl?.startsWith("data:"))return dataUrl;
  const{ref,uploadString,getDownloadURL}=window._fs;
  const r=ref(window._st,path);
  await uploadString(r,dataUrl,"data_url");
  return getDownloadURL(r);
};
const sendMsg=async(chatId,msg)=>{
  const{collection,addDoc,serverTimestamp}=window._fs;
  await addDoc(collection(window._db,"chats",chatId,"messages"),{...msg,time:serverTimestamp()});
};

  const pick=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setAv(ev.target.result);r.readAsDataURL(f);};

      React.createElement("textarea",{value:text,onChange:e=>setText(e.target.value),onKeyDown:handleKey,placeholder:s.typeMsg,rows:1,style:{flex:1,padding:"11px 14px",borderRadius:22,border:"1.5px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.08)",color:"#fff",fontFamily:"Nunito,sans-serif",fontSize:15,outline:"none",resize:"none",maxHeight:100,lineHeight:1.5,backdropFilter:"blur(10px)"}}),
      React.createElement("button",{className:"btn-candy",onClick:doSend,disabled:!text.trim(),style:{width:42,height:42,padding:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0,borderRadius:"50%",opacity:text.trim()?1:0.4}},
        React.createElement("span",{style:{transform:"rotate(45deg)",display:"block"}},"➤")
      )
    ),
    // Context menu
    ctxMenu&&React.createElement("div",{className:"ctx",style:{top:Math.min(ctxMenu.pos.y,window.innerHeight-220),left:Math.min(ctxMenu.pos.x,window.innerWidth-170)}},
      [{ic:"↩️",lb:s.reply,fn:()=>setReplyTo(ctxMenu.msg)},
       {ic:"📋",lb:s.copy,fn:()=>navigator.clipboard?.writeText(ctxMenu.msg.text||"")},
       {ic:"↗️",lb:s.fwd,fn:()=>{onForward(ctxMenu.msg);setCtxMenu(null);}},
       ...(ctxMenu.msg.fromUid===me.uid?[{ic:"🗑️",lb:s.del,fn:()=>doDelete(ctxMenu.msg.id),danger:true}]:[])
      ].map((item,i)=>React.createElement("button",{key:i,className:"ctx-btn"+(item.danger?" danger":""),onClick:()=>{item.fn();setCtxMenu(null);}},
        React.createElement("span",null,item.ic),React.createElement("span",null,item.lb)
      ))
    )
  );
}

  const s=S[lang];

  return React.createElement("div",{className:"screen",style:{color:"#fff",overflowY:"auto"}},
    React.createElement("div",{className:"hdr"},
      React.createElement("button",{className:"btn-ghost",onClick:onBack,style:{width:36,height:36,padding:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}},"←"),
      React.createElement("h2",{style:{flex:1,fontSize:18,fontWeight:700,color:"#fff"}},s.settings)
    ),
    React.createElement("div",{style:{padding:"16px 16px 40px"}},
      // Profile card
      React.createElement("div",{className:"glass",style:{padding:18,display:"flex",alignItems:"center",gap:14,marginBottom:14,cursor:"pointer"},onClick:onEdit},
        React.createElement(Av,{u:me,size:58}),
        React.createElement("div",{style:{flex:1}},
          React.createElement("p",{style:{margin:0,fontWeight:700,fontSize:17}},me.name),
          React.createElement("p",{style:{margin:0,fontSize:13,color:"rgba(255,255,255,0.45)"}},me.bio||me.phone),
          React.createElement("p",{style:{margin:"4px 0 0",fontSize:12,color:"#A855F7",fontWeight:600}},s.editProfile+" →")
        )
      ),
      // Rename me
      renaming
        ?React.createElement("div",{className:"glass",style:{borderRadius:16,padding:14,marginBottom:10}},
            React.createElement("p",{style:{color:"rgba(255,255,255,0.5)",fontSize:12,marginBottom:8}},s.renameMe),
            React.createElement("div",{style:{display:"flex",gap:8}},
              React.createElement("input",{className:"inp-glass",style:{flex:1,padding:"10px 12px",fontSize:14},value:newName,onChange:e=>setNewName(e.target.value),autoFocus:true}),
              React.createElement("button",{className:"btn-candy",onClick:()=>{onRenameMe(newName);setRenaming(false);},style:{padding:"10px 16px",fontSize:13,flexShrink:0}},s.rename)
            )
          )
        :React.createElement("div",{className:"srow glass-light",style:{marginBottom:6,borderRadius:14},onClick:()=>setRenaming(true)},
            React.createElement("span",{style:{fontSize:20}},"✏️"),
            React.createElement("span",{style:{flex:1,fontSize:14,fontWeight:600}},s.renameMe),
            React.createElement("span",{style:{color:"rgba(255,255,255,0.3)",fontSize:16}},"›")
          ),
      // Language
      React.createElement("div",{className:"glass",style:{borderRadius:16,padding:16,marginBottom:10}},
        React.createElement("p",{style:{color:"rgba(255,255,255,0.5)",fontSize:12,fontWeight:600,letterSpacing:.5,marginBottom:10,textTransform:"uppercase"}},s.language),
        React.createElement("div",{style:{display:"flex",gap:8}},
          ["id","en"].map(l=>React.createElement("button",{key:l,onClick:()=>onLang(l),style:{flex:1,padding:"10px",borderRadius:12,cursor:"pointer",border:`1.5px solid ${lang===l?"rgba(168,85,247,0.7)":"rgba(255,255,255,0.15)"}`,background:lang===l?"rgba(168,85,247,0.2)":"rgba(255,255,255,0.05)",color:lang===l?"#E9D5FF":"rgba(255,255,255,0.5)",fontFamily:"Nunito,sans-serif",fontSize:13,fontWeight:600}},
            l==="id"?"🇮🇩 Indonesia":"🇬🇧 English"
          ))
        )
      ),
      // Logout
      React.createElement("button",{className:"btn-ghost",onClick:onLogout,style:{width:"100%",padding:13,fontSize:14,color:"#F87171",border:"1.5px solid rgba(248,113,113,0.3)",borderRadius:14,marginTop:6}},`🚪 ${s.logout}`),
      React.createElement("p",{style:{textAlign:"center",marginTop:20,color:"rgba(255,255,255,0.2)",fontSize:10}},s.copyright)
    )
  );
}

// ── FORWARD SHEET ─────────────────────────────────────────────
function ForwardSheet({me,lang,contacts,msg,onClose,onForward}){
  const s=S[lang];
  return React.createElement("div",{className:"overlay",onClick:onClose},
    React.createElement("div",{className:"sheet",onClick:e=>e.stopPropagation(),style:{maxHeight:"60vh"}},
      React.createElement("div",{style:{width:40,height:4,borderRadius:2,background:"rgba(255,255,255,0.2)",margin:"0 auto 16px"}}),
      React.createElement("h3",{style:{color:"#fff",fontSize:16,fontWeight:700,marginBottom:16}},s.fwdTo),
      contacts.map(c=>React.createElement("div",{key:c.uid,onClick:()=>onForward(c,msg),style:{display:"flex",alignItems:"center",gap:12,padding:"10px 0",cursor:"pointer",borderBottom:"1px solid rgba(255,255,255,0.08)"}},
        React.createElement(Av,{u:c,size:40}),
        React.createElement("p",{style:{margin:0,fontWeight:700,color:"#fff"}},c.displayName||c.name)
      ))

  );
}

// ── MAIN APP ────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("splash");
  const [lang,setLang]=useState(()=>localStorage.getItem("vt_lang")||"id");
  const [me,setMe]=useState(null);
  const [contacts,setContacts]=useState([]);
  const [lastMsgs,setLastMsgs]=useState({});
  const [unread,setUnread]=useState({});
  const [active,setActive]=useState(null);
  const [fwdData,setFwdData]=useState(null);
  const [profileView,setProfileView]=useState(null);
  const unsubsRef=useRef([]);

  // Init
  useEffect(()=>{
    const go=async()=>{
      const uid=localStorage.getItem("vt_uid");
      const vt=localStorage.getItem("vt");
      if(uid&&vt){
        try{
          const p=JSON.parse(vt);
          setMe(p);
          const saved=localStorage.getItem("vt_c");
          if(saved) setContacts(JSON.parse(saved));
          if(window._fbOk){
            const fresh=await fsGet("users",uid);
            if(fresh){setMe(fresh);localStorage.setItem("vt",JSON.stringify(fresh));}
            fsOnline(uid,true);
          }
          setScreen("chats");
        }catch(e){setScreen("setup");}
      }else{
        setScreen("setup");
      }
    };
    const ti=setTimeout(go,1800);
    return()=>clearTimeout(ti);
  },[]);

  // Listen contacts last messages
  useEffect(()=>{
    if(!me||!window._fbOk||contacts.length===0)return;
    unsubsRef.current.forEach(u=>u());
    unsubsRef.current=[];
    contacts.forEach(c=>{
      const id=cid(me.uid,c.uid);
      const{collection,query,orderBy,onSnapshot}=window._fs;
      const q=query(collection(window._db,"chats",id,"messages"),orderBy("time","desc"));
      let first=true;
      const unsub=onSnapshot(q,snap=>{
        if(!snap.empty){
          const last=snap.docs[0].data();
          setLastMsgs(prev=>{
            if(!first&&last.fromUid!==me.uid&&!last.deleted){
              const lt=last.time?.toMillis?.()|| 0;
              const pt=prev[c.uid]?.time?.toMillis?.()|| 0;
              if(lt>pt) window.notif?.(c.displayName||c.name,last.image?"📷 Foto":last.text,c.avatarUrl);
            }
            first=false;
            return{...prev,[c.uid]:last};
          });
          const ur=snap.docs.filter(d=>{const m=d.data();return m.toUid===me.uid&&!m.read&&!m.deleted;}).length;
          setUnread(prev=>({...prev,[c.uid]:ur}));
        }
      });
      unsubsRef.current.push(unsub);
    });
    return()=>{unsubsRef.current.forEach(u=>u());};
  },[me,contacts]);

  // Online status
  useEffect(()=>{
    if(!me||!window._fbOk)return;
    fsOnline(me.uid,true);
    const off=()=>fsOnline(me.uid,false);
    window.addEventListener("beforeunload",off);
    const iv=setInterval(()=>fsOnline(me.uid,true),45000);
    return()=>{window.removeEventListener("beforeunload",off);clearInterval(iv);};
  },[me]);

  // Back button
  useEffect(()=>{
    const handler=()=>{
      if(fwdData){setFwdData(null);return;}
      if(profileView){setProfileView(null);return;}
      if(screen==="chat"){setScreen("chats");return;}
      if(screen==="newchat"||screen==="settings"||screen==="profile"){
        setScreen(screen==="profile"?"settings":"chats");return;
      }
      window.history.pushState(null,"",window.location.href);
    };
    window.history.pushState(null,"",window.location.href);
    window.addEventListener("popstate",handler);
    return()=>window.removeEventListener("popstate",handler);
  },[screen,fwdData,profileView]);

  const addContact=c=>{
    if(!contacts.find(x=>x.uid===c.uid)){
      const updated=[...contacts,c];
      setContacts(updated);
      localStorage.setItem("vt_c",JSON.stringify(updated));
    }
    setActive(c);setScreen("chat");
    setUnread(prev=>({...prev,[c.uid]:0}));
  };

  const openChat=c=>{
    setActive(c);setScreen("chat");
    setUnread(prev=>({...prev,[c.uid]:0}));
  };

  const renameContact=(uid,newName)=>{
    const updated=contacts.map(c=>c.uid===uid?{...c,displayName:newName}:c);
    setContacts(updated);
    localStorage.setItem("vt_c",JSON.stringify(updated));
    if(active?.uid===uid) setActive(prev=>({...prev,displayName:newName}));
  };

  const renameMe=async(newName)=>{
    if(!newName.trim())return;
    const updated={...me,name:newName.trim()};
    setMe(updated);
    localStorage.setItem("vt",JSON.stringify(updated));
    if(window._fbOk) await fsSave("users",me.uid,{name:newName.trim()});
  };

  const doForward=async(toContact,msg)=>{
    const id=cid(me.uid,toContact.uid);
    await sendMsg(id,{text:msg.text||"",image:msg.image||null,fromUid:me.uid,toUid:toContact.uid,read:false,deleted:false,replyTo:null});
    if(!contacts.find(x=>x.uid===toContact.uid)){
      const updated=[...contacts,toContact];
      setContacts(updated);
      localStorage.setItem("vt_c",JSON.stringify(updated));
    }
    setFwdData(null);
  };

  const logout=()=>{
    if(me&&window._fbOk) fsOnline(me.uid,false);
    ["vt_uid","vt","vt_c","vt_lang"].forEach(k=>localStorage.removeItem(k));
    unsubsRef.current.forEach(u=>u());
    setMe(null);setContacts([]);setScreen("setup");
  };

  const handleLang=l=>{setLang(l);localStorage.setItem("vt_lang",l);};

  return React.createElement("div",{style:{position:"relative",height:"100%",overflow:"hidden"}},
    // Screens
    screen==="splash"&&React.createElement(Splash,null),
    screen==="setup"&&React.createElement(Setup,{initUser:me,lang,onDone:p=>{setMe(p);setScreen("chats");}}),
    screen==="chats"&&me&&React.createElement(ChatList,{me,lang,contacts,lastMsgs,unread,onOpen:openChat,onNew:()=>setScreen("newchat"),onSettings:()=>setScreen("settings"),onProfileView:c=>setProfileView(c)}),
    screen==="newchat"&&me&&React.createElement(FindUser,{me,lang,contacts,onSelect:addContact,onBack:()=>setScreen("chats")}),
    screen==="chat"&&active&&me&&React.createElement(ChatRoom,{me,lang,contact:active,onBack:()=>setScreen("chats"),contacts,onForward:msg=>setFwdData(msg),onProfileView:c=>setProfileView(c)}),
    screen==="settings"&&me&&React.createElement(Settings,{me,lang,onLang:handleLang,onLogout:logout,onBack:()=>setScreen("chats"),onEdit:()=>setScreen("profile"),onRenameMe:renameMe}),
    screen==="profile"&&me&&React.createElement(Setup,{initUser:me,lang,onDone:p=>{setMe(p);localStorage.setItem("vt",JSON.stringify(p));setScreen("settings");}}),
    // Profile view overlay
    profileView&&React.createElement(ProfileView,{u:{...profileView,displayName:contacts.find(c=>c.uid===profileView.uid)?.displayName},lang,onClose:()=>setProfileView(null),onStartChat:()=>{addContact(profileView);setProfileView(null);},onRename:n=>{renameContact(profileView.uid,n);setProfileView(null);}}),
    // Forward sheet
    fwdData&&React.createElement(ForwardSheet,{me,lang,contacts:contacts.filter(c=>c.uid!==active?.uid),msg:fwdData,onClose:()=>setFwdData(null),onForward:doForward})
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
