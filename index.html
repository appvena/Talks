    // ── EDIT PROFILE ─────────────────────────────────────────
    function EditProfile({theme,t,user,onBack,onSave,fbReady}){
      const [name,setName]=useState(user.name||"");
      const [bio,setBio]=useState(user.bio||"");
      const [avatar,setAvatar]=useState(user.avatarUrl||null);
      const [saving,setSaving]=useState(false);
      const fileRef=useRef();

      const save=async()=>{
        setSaving(true);
        try{
          let av=avatar;
          if(fbReady&&avatar&&user.uid&&avatar.startsWith("data:"))av=await uploadFile(`avatars/${user.uid}.jpg`,avatar);
          const updated={...user,name,bio,avatarUrl:av};
          if(fbReady&&user.uid)await fsSet("users",user.uid,{name,bio,avatarUrl:av});
          onSave(updated);
        }catch(e){console.error(e);}
        setSaving(false);
      };

      return React.createElement("div",{style:{minHeight:"100vh",background:theme.bg,fontFamily:theme.font,maxWidth:480,margin:"0 auto"}},
        React.createElement("div",{style:{background:theme.headerGrad,padding:"16px 20px",display:"flex",alignItems:"center",gap:12}},
          React.createElement("button",{onClick:onBack,style:{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:"50%",width:36,height:36,cursor:"pointer",color:"#fff",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center"}},"←"),
          React.createElement("h2",{style:{margin:0,color:"#fff",fontFamily:theme.fontDisplay,fontSize:20}},t.editProfile)
        ),
        React.createElement("div",{style:{padding:24}},
          React.createElement("div",{style:{textAlign:"center",marginBottom:24}},
            React.createElement("div",{onClick:()=>fileRef.current.click(),style:{width:100,height:100,borderRadius:"50%",margin:"0 auto 10px",overflow:"hidden",cursor:"pointer",border:`3px solid ${theme.primary}`}},
              avatar?React.createElement("img",{src:avatar,style:{width:"100%",height:"100%",objectFit:"cover"}}):React.createElement("div",{style:{width:"100%",height:"100%",background:theme.bgSecondary,display:"flex",alignItems:"center",justifyContent:"center",fontSize:36}},"📷")
            ),
            React.createElement("input",{ref:fileRef,type:"file",accept:"image/*",style:{display:"none"},onChange:e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setAvatar(ev.target.result);r.readAsDataURL(f);}}),
            React.createElement("button",{onClick:()=>fileRef.current.click(),style:{background:"none",border:`1.5px solid ${theme.primary}`,color:theme.primary,borderRadius:8,padding:"5px 14px",fontFamily:theme.font,fontSize:13,cursor:"pointer"}},t.uploadPhoto)
          ),
          [{label:t.username,val:name,set:setName},{label:t.bio,val:bio,set:setBio}].map(({label,val,set},i)=>
            React.createElement("div",{key:i,style:{marginBottom:16}},
              React.createElement("label",{style:{display:"block",color:theme.textSecondary,fontSize:13,fontWeight:600,marginBottom:6}},label),
              React.createElement("input",{style:{width:"100%",padding:"13px 16px",borderRadius:14,border:`2px solid ${theme.border}`,background:theme.surfaceSecondary,color:theme.text,fontFamily:theme.font,fontSize:15,outline:"none",boxSizing:"border-box"},value:val,onChange:e=>set(e.target.value)})
            )
          ),
          React.createElement("p",{style:{color:theme.textMuted,fontSize:13,margin:"0 0 16px"}},user.phone),
          React.createElement("button",{onClick:save,disabled:saving,style:{width:"100%",padding:14,borderRadius:14,background:theme.headerGrad,border:"none",color:"#fff",fontFamily:theme.font,fontSize:15,fontWeight:700,cursor:"pointer",opacity:saving?0.7:1}},saving?"⏳ Menyimpan...":t.save)
        )
      );
    }

    // ── NEW CHAT ─────────────────────────────────────────────
    function NewChat({theme,t,contacts,onSelect,onBack}){
      const [search,setSearch]=useState("");
      const filtered=contacts.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.phone.includes(search));
      return React.createElement("div",{style:{minHeight:"100vh",background:theme.bg,fontFamily:theme.font,maxWidth:480,margin:"0 auto"}},
        React.createElement("div",{style:{background:theme.headerGrad,padding:"16px 20px",display:"flex",alignItems:"center",gap:12}},
          React.createElement("button",{onClick:onBack,style:{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:"50%",width:36,height:36,cursor:"pointer",color:"#fff",fontSize:20,display:"flex",alignItems:"center",justifyContent:"center"}},"←"),
          React.createElement("h2",{style:{margin:0,color:"#fff",fontFamily:theme.fontDisplay,fontSize:20}},t.newChat)
        ),
        React.createElement("div",{style:{padding:16}},
          React.createElement("input",{style:{width:"100%",padding:"12px 16px",borderRadius:14,border:`2px solid ${theme.border}`,background:theme.surface,color:theme.text,fontFamily:theme.font,fontSize:15,outline:"none",boxSizing:"border-box"},placeholder:t.search,value:search,onChange:e=>setSearch(e.target.value),autoFocus:true})
        ),
        filtered.map(c=>
          React.createElement("div",{key:c.id,onClick:()=>onSelect(c),style:{display:"flex",alignItems:"center",gap:14,padding:"12px 20px",cursor:"pointer",borderBottom:`1px solid ${theme.border}`,background:theme.surface,transition:"background 0.15s"},onMouseEnter:e=>e.currentTarget.style.background=theme.bgSecondary,onMouseLeave:e=>e.currentTarget.style.background=theme.surface},
            React.createElement(Avatar,{contact:c,theme,showStatus:true}),
            React.createElement("div",null,
              React.createElement("p",{style:{margin:0,fontWeight:700,color:theme.text}},c.name),
              React.createElement("p",{style:{margin:0,fontSize:13,color:theme.textMuted}},c.bio||c.phone)
            )
          )
        )
      );
    }

    // ── MAIN APP ─────────────────────────────────────────────
    function App(){
      const [screen,setScreen]=useState("splash");
      const [themeName,setThemeName]=useState("soft");
      const [lang,setLang]=useState("id");
      const [autoTheme,setAutoTheme]=useState(true);
      const [user,setUser]=useState(null);
      const [contacts]=useState(DEMO_CONTACTS);
      const [messages,setMessages]=useState(DEMO_MSGS);
      const [active,setActive]=useState(null);
      const [fbReady,setFbReady]=useState(false);
      const [pPhone,setPPhone]=useState(null);
      const [pUid,setPUid]=useState(null);

      const prefersDark=window.matchMedia?.("(prefers-color-scheme: dark)").matches;
      const theme=(()=>{
        if(autoTheme&&prefersDark&&THEMES_DARK[themeName])return THEMES_DARK[themeName];
        return THEMES[themeName];
      })();
      const t=T[lang];

      useEffect(()=>{
        // Wait for Firebase
        if(window._fbReady){setFbReady(true);}
        else{window.addEventListener("fbReady",()=>setFbReady(true),{once:true});}
        const ti=setTimeout(()=>setScreen("login"),2200);
        return()=>clearTimeout(ti);
      },[]);

      const openChat=c=>{
        setMessages(prev=>({...prev,[c.id]:(prev[c.id]||[]).map(m=>({...m,read:true}))}));
        setActive(c);setScreen("chat");
      };

      const sendMsg=(cid,data)=>{
        const msg={id:"m"+Date.now(),...data,from:"me",time:new Date(),read:false,deleted:false};
        setMessages(prev=>({...prev,[cid]:[...(prev[cid]||[]),msg]}));
        setTimeout(()=>{
          const r={id:"r"+Date.now(),text:REPLIES[Math.floor(Math.random()*REPLIES.length)],from:cid,time:new Date(),read:false,deleted:false,replyTo:null};
          setMessages(prev=>({...prev,[cid]:[...(prev[cid]||[]),r]}));
        },1500+Math.random()*2000);
      };

      const deleteMsg=(cid,mid)=>setMessages(prev=>({...prev,[cid]:(prev[cid]||[]).map(m=>m.id===mid?{...m,deleted:true,text:"",image:null}:m)}));
      const forwardMsg=(toId,msg)=>{sendMsg(toId,{text:msg.text,image:msg.image||null,replyTo:null});openChat(contacts.find(c=>c.id===toId));};

      return React.createElement(React.Fragment,null,
        screen==="splash" && React.createElement(Splash,{theme,t}),
        screen==="login"  && React.createElement(Login,{theme,t,onLogin:(p,u)=>{setPPhone(p);setPUid(u);setScreen("setup");},fbReady}),
        screen==="setup"  && React.createElement(SetupProfile,{theme,t,phone:pPhone,uid:pUid,fbReady,onSave:p=>{setUser(p);setScreen("chats");}}),
        screen==="chats"  && user && React.createElement(ChatList,{theme,t,user,contacts,messages,onOpen:openChat,onNew:()=>setScreen("newchat"),onSettings:()=>setScreen("settings")}),
        screen==="chat"   && active && React.createElement(ChatRoom,{theme,t,user,contact:active,messages:messages[active.id]||[],onBack:()=>setScreen("chats"),onSend:sendMsg,onDelete:deleteMsg,onForward:forwardMsg,contacts}),
        screen==="settings" && React.createElement(Settings,{theme,t,user,curTheme:themeName,lang,autoTheme,onTheme:setThemeName,onLang:setLang,onAuto:()=>setAutoTheme(v=>!v),onLogout:()=>{setUser(null);setScreen("login");},onBack:()=>setScreen("chats"),onEditProfile:()=>setScreen("profile")}),
        screen==="profile"  && React.createElement(EditProfile,{theme,t,user,onBack:()=>setScreen("settings"),onSave:p=>{setUser(p);setScreen("settings");},fbReady}),
        screen==="newchat"  && React.createElement(NewChat,{theme,t,contacts,onSelect:openChat,onBack:()=>setScreen("chats")})
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
