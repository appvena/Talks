<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vena Talks - Hubungkan Hatimu</title>
    <!-- Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons untuk Ikon Cantik -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Manifest PWA agar bisa Diinstal di HP -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#C084FC">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Hide scrollbar untuk Chrome, Safari dan Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar untuk IE, Edge dan Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-purple-50 text-slate-800 antialiased">

    <!-- Container Utama Aplikasi -->
    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative flex flex-col overflow-hidden">
        <!-- Konten aplikasi akan dirender secara dinamis oleh JavaScript di sini -->
    </div>

    <!-- Wadah reCAPTCHA Tersembunyi untuk Keamanan OTP (Wajib Ada) -->
    <div id="recaptcha-container"></div>

    <!-- ========================================================== -->
    <!-- SCRIPT UTAMA: FIREBASE SDK + LOGIKA APLIKASI VENA TALKS -->
    <!-- ========================================================== -->
    <script type="module">
        // 1. IMPORT FIREBASE SDK LANGSUNG DARI INTERNET (CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPhoneNumber, RecaptchaVerifier, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. KONFIGURASI PROJECT FIREBASE (Ganti dengan data asli dari Firebase Console jika berbeda)
        const firebaseConfig = {
            apiKey: "AIzaSyA1...", // <-- GANTI DENGAN API KEY ASLI KAMU JIKA BERBEDA
            authDomain: "appsvena-talks.firebaseapp.com",
            projectId: "appsvena-talks",
            storageBucket: "appsvena-talks.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef..."
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variabel Global Internal Aplikasi
        let confirmationResult = null;
        let currentUser = null;
        let currentScreen = "login-phone"; // Pilihan: login-phone, login-otp, chat-list, chat-room
        let activeContact = null;
        let messagesListenerUnsubscribe = null;

        // Data Kontak Simulasi (Bisa kamu kembangkan ke Firestore nantinya)
        const CONTACTS = [
            { id: "vena_bot", name: "Vena AI Assistant", avatar: "🤖", status: "Online", bio: "Siap membantumu kapan saja ✨" },
            { id: "support_team", name: "Vena Support Team", avatar: "👑", status: "Offline", bio: "Hubungi kami jika ada kendala sistem." }
        ];

        // 3. PENGATUR ALUR LAYAR & RENDER (STATE MANAGEMENT)
        const appContainer = document.getElementById("app");

        function changeScreen(screenName) {
            currentScreen = screenName;
            renderApp();
        }

        // Jalankan Pendengar Status Login (Auto-login jika session masih ada)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                changeScreen("chat-list");
            } else {
                currentUser = null;
                changeScreen("login-phone");
            }
        });

        // 4. LOGIKA AUTHENTICATION (OTP VIA SMS)
        function initRecaptcha() {
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                    'size': 'invisible'
                });
            }
        }

        function handleSendOTP() {
            const phoneInput = document.getElementById("input-phone").value.trim();
            if (!phoneInput.startsWith("+")) {
                alert("Nomor HP harus diawali dengan kode negara, contoh: +628123456789");
                return;
            }

            initRecaptcha();
            const appVerifier = window.recaptchaVerifier;

            const btn = document.getElementById("btn-send-otp");
            btn.innerText = "Mengirim SMS...";
            btn.disabled = true;

            signInWithPhoneNumber(auth, phoneInput, appVerifier)
                .then((result) => {
                    confirmationResult = result;
                    alert("Kode OTP berhasil dikirim ke " + phoneInput);
                    changeScreen("login-otp");
                })
                .catch((error) => {
                    alert("Gagal mengirim SMS: " + error.message);
                    btn.innerText = "Kirim Kode Verifikasi";
                    btn.disabled = false;
                });
        }

        function handleVerifyOTP() {
            const otpInput = document.getElementById("input-otp").value.trim();
            if (otpInput.length !== 6) {
                alert("Kode OTP harus terdiri dari 6 digit angka!");
                return;
            }

            const btn = document.getElementById("btn-verify-otp");
            btn.innerText = "Memverifikasi...";
            btn.disabled = true;

            confirmationResult.confirm(otpInput)
                .then((result) => {
                    currentUser = result.user;
                    alert("Login Berhasil!");
                    changeScreen("chat-list");
                })
                .catch((error) => {
                    alert("Kode OTP salah atau sudah kedaluwarsa!");
                    btn.innerText = "Verifikasi & Masuk";
                    btn.disabled = false;
                });
        }

        function handleLogout() {
            if (confirm("Apakah kamu yakin ingin keluar dari Vena Talks?")) {
                signOut(auth).then(() => {
                    if (messagesListenerUnsubscribe) messagesListenerUnsubscribe();
                    activeContact = null;
                    changeScreen("login-phone");
                });
            }
        }

        // 5. LOGIKA REAL-TIME CHAT (FIRESTORE)
        async function handleSendMessage() {
            const chatInput = document.getElementById("chat-message-input");
            const text = chatInput.value.trim();
            if (!text || !activeContact) return;

            chatInput.value = ""; // Kosongkan kolom input segera

            try {
                // Menyimpan pesan langsung ke sub-koleksi dokumen Firestore
                await addDoc(collection(db, "chats", activeContact.id, "messages"), {
                    text: text,
                    image: null,
                    from: currentUser.uid, // Disimpan menggunakan ID Unik Firebase kamu
                    senderPhone: currentUser.phoneNumber,
                    time: Date.now(),
                    read: false
                });
                
                // Simulasi Balasan Otomatis Khusus untuk Vena AI Bot
                if (activeContact.id === "vena_bot") {
                    setTimeout(async () => {
                        await addDoc(collection(db, "chats", activeContact.id, "messages"), {
                            text: `Halo! Ini adalah respon otomatis dari Vena AI. Pesanmu yang berbunyi "${text}" telah diterima sistem dengan aman! 🤖✨`,
                            image: null,
                            from: "vena_bot",
                            senderPhone: "System",
                            time: Date.now(),
                            read: false
                        });
                    }, 1500);
                }

            } catch (error) {
                console.error("Gagal mengirim pesan ke Firestore:", error);
            }
        }

        function listenToMessages(contactId) {
            if (messagesListenerUnsubscribe) messagesListenerUnsubscribe();

            const q = query(
                collection(db, "chats", contactId, "messages"),
                orderBy("time", "asc")
            );

            messagesListenerUnsubscribe = onSnapshot(q, (querySnapshot) => {
                const chatBox = document.getElementById("chat-box-messages");
                if (!chatBox) return;

                chatBox.innerHTML = ""; // Bersihkan kontainer chat layar lama

                querySnapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.from === currentUser.uid;

                    const msgBubble = document.createElement("div");
                    msgBubble.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-3 animate-fade-in`;
                    
                    const timeString = new Date(msg.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    msgBubble.innerHTML = `
                        <div class="max-w-[75%] rounded-2xl px-4 py-2.5 shadow-sm ${isMe ? 'bg-purple-500 text-white rounded-br-none' : 'bg-slate-100 text-slate-800 rounded-bl-none'}">
                            <p class="text-[15px] leading-relaxed break-words">${msg.text}</p>
                            <span class="block text-[10px] mt-1 text-right ${isMe ? 'text-purple-200' : 'text-slate-400'}">${timeString}</span>
                        </div>
                    `;
                    chatBox.appendChild(msgBubble);
                });

                // Auto gulung/scroll ke pesan paling bawah otomatis
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function openChatRoom(contact) {
            activeContact = contact;
            changeScreen("chat-room");
            listenToMessages(contact.id);
        }

        // 6. RENDERER HTML KODE INTERFACE (UI)
        function renderApp() {
            // A. LAYAR INPUT NOMOR HP
            if (currentScreen === "login-phone") {
                appContainer.innerHTML = `
                    <div class="flex-1 flex flex-col justify-center items-center px-6 py-12 bg-gradient-to-b from-purple-50 to-white">
                        <div class="w-20 h-20 bg-purple-500 rounded-3xl flex items-center justify-center text-white text-4xl shadow-lg shadow-purple-200 mb-6">💜</div>
                        <h1 class="text-2xl font-bold text-slate-800 mb-2">Selamat Datang di Vena Talks</h1>
                        <p class="text-sm text-slate-500 text-center mb-8">Masuk menggunakan nomor ponselmu untuk menikmati obrolan aman terlindungi.</p>
                        
                        <div class="w-full space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Nomor Telepon (Gunakan Kode Negara)</label>
                                <input type="tel" id="input-phone" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-purple-500 transition" placeholder="+628123456789" value="+62">
                            </div>
                            <button id="btn-send-otp" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-semibold py-3.5 rounded-xl shadow-md shadow-purple-100 transition duration-200">Kirim Kode Verifikasi</button>
                        </div>
                    </div>
                `;
                document.getElementById("btn-send-otp").onclick = handleSendOTP;
            }

            // B. LAYAR VERIFIKASI KODE OTP SMS
            else if (currentScreen === "login-otp") {
                appContainer.innerHTML = `
                    <div class="flex-1 flex flex-col justify-center items-center px-6 py-12 bg-gradient-to-b from-purple-50 to-white">
                        <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mb-6"><i data-lucide="shield-check" class="w-8 h-8"></i></div>
                        <h1 class="text-xl font-bold text-slate-800 mb-2">Verifikasi Nomormu</h1>
                        <p class="text-sm text-slate-500 text-center mb-8">Masukkan 6 digit kode OTP unik yang telah kami kirimkan ke nomor ponselmu.</p>
                        
                        <div class="w-full space-y-4">
                            <input type="text" id="input-otp" maxlength="6" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-center text-2xl font-bold tracking-[0.5em] focus:outline-none focus:border-purple-500 transition" placeholder="000000">
                            <button id="btn-verify-otp" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-semibold py-3.5 rounded-xl shadow-md shadow-purple-100 transition duration-200">Verifikasi & Masuk</button>
                            <button id="btn-back-otp" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 rounded-xl text-xs transition">Kembali ganti nomor</button>
                        </div>
                    </div>
                `;
                lucide.createIcons();
                document.getElementById("btn-verify-otp").onclick = handleVerifyOTP;
                document.getElementById("btn-back-otp").onclick = () => changeScreen("login-phone");
            }

            // C. LAYAR DAFTAR KONTAK OBROLAN (CHAT LIST)
            else if (currentScreen === "chat-list") {
                appContainer.innerHTML = `
                    <!-- Header -->
                    <div class="bg-purple-500 text-white px-4 py-4 flex items-center justify-between sticky top-0 z-10 shadow-md">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold text-xl">V</div>
                            <div>
                                <h2 class="font-bold text-base">Vena Talks</h2>
                                <p class="text-xs text-purple-100">${currentUser ? currentUser.phoneNumber : ''}</p>
                            </div>
                        </div>
                        <button id="btn-logout" class="p-2 hover:bg-white/10 rounded-full transition"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                    </div>
                    
                    <!-- Search Bar -->
                    <div class="p-3 bg-slate-50 border-b border-slate-100">
                        <div class="bg-white border border-slate-200 rounded-xl px-3 py-2 flex items-center gap-2"><i data-lucide="search" class="w-4 h-4 text-slate-400"></i><input type="text" placeholder="Cari obrolan..." class="w-full text-sm bg-transparent outline-none"></div>
                    </div>

                    <!-- List Items -->
                    <div id="contacts-container" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                        <!-- Diisi via loop di bawah -->
                    </div>
                `;
                lucide.createIcons();
                document.getElementById("btn-logout").onclick = handleLogout;

                const listContainer = document.getElementById("contacts-container");
                CONTACTS.forEach(c => {
                    const row = document.createElement("div");
                    row.className = "p-4 flex items-center justify-between hover:bg-purple-50/50 cursor-pointer transition";
                    row.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center text-2xl">${c.avatar}</div>
                            <div>
                                <h4 class="font-semibold text-sm text-slate-800">${c.name}</h4>
                                <p class="text-xs text-slate-400 truncate max-w-[200px]">${c.bio}</p>
                            </div>
                        </div>
                        <div class="text-right"><span class="inline-block w-2 h-2 rounded-full ${c.status === 'Online' ? 'bg-emerald-400' : 'bg-slate-300'}"></span><p class="text-[10px] text-slate-400 mt-1">${c.status}</p></div>
                    `;
                    row.onclick = () => openChatRoom(c);
                    listContainer.appendChild(row);
                });
            }

            // D. LAYAR RUANG OBROLAN (CHAT ROOM)
            else if (currentScreen === "chat-room") {
                appContainer.innerHTML = `
                    <!-- Room Header -->
                    <div class="bg-white border-b border-slate-100 px-3 py-3.5 flex items-center justify-between sticky top-0 z-10 shadow-sm">
                        <div class="flex items-center gap-2">
                            <button id="btn-back-to-list" class="p-1.5 hover:bg-slate-100 rounded-full text-slate-600 transition"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
                            <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center text-xl">${activeContact.avatar}</div>
                            <div>
                                <h3 class="font-bold text-sm text-slate-800">${activeContact.name}</h3>
                                <p class="text-[11px] ${activeContact.status === 'Online' ? 'text-emerald-500 font-medium' : 'text-slate-400'}">${activeContact.status}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 text-slate-500"><button class="p-2 hover:bg-slate-50 rounded-full"><i data-lucide="phone" class="w-4 h-4"></i></button><button class="p-2 hover:bg-slate-50 rounded-full"><i data-lucide="more-vertical" class="w-4 h-4"></i></button></div>
                    </div>

                    <!-- Kotak Riwayat Chat (Scrollable) -->
                    <div id="chat-box-messages" class="flex-1 overflow-y-auto p-4 bg-slate-50/60 no-scrollbar">
                        <div class="text-center my-4"><span class="text-xs bg-slate-200 text-slate-500 px-3 py-1 rounded-full">Mengambil pesan aman...</span></div>
                    </div>

                    <!-- Input Bar Bottom -->
                    <div class="p-3 bg-white border-t border-slate-100 flex items-center gap-2 sticky bottom-0">
                        <button class="p-2 text-slate-400 hover:text-purple-500 transition"><i data-lucide="plus" class="w-5 h-5"></i></button>
                        <div class="flex-1 bg-slate-100 rounded-xl px-4 py-2.5 flex items-center">
                            <input type="text" id="chat-message-input" placeholder="Ketik pesan..." class="w-full text-sm bg-transparent outline-none text-slate-700">
                        </div>
                        <button id="btn-send-message" class="w-10 h-10 bg-purple-500 hover:bg-purple-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-purple-100 transition"><i data-lucide="send" class="w-4 h-4"></i></button>
                    </div>
                `;
                lucide.createIcons();
                document.getElementById("btn-back-to-list").onclick = () => {
                    if (messagesListenerUnsubscribe) messagesListenerUnsubscribe();
                    activeContact = null;
                    changeScreen("chat-list");
                };
                
                // Trigger Kirim dengan tombol klik atau menekan tombol Enter
                document.getElementById("btn-send-message").onclick = handleSendMessage;
                document.getElementById("chat-message-input").onkeydown = (e) => {
                    if (e.key === "Enter") handleSendMessage();
                };

                // Muat ulang isi pesan aktif real-time dari Firestore
                if (activeContact) listenToMessages(activeContact.id);
            }
        }

        // Pemicu Awal Pemuatan Tampilan
        renderApp();
    </script>

    <!-- Script PWA Pendaftar Service Worker Otomatis -->
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js")
                .then(() => console.log("PWA Service Worker Aktif Pasang"))
                .catch(err => console.log("Gagal PWA:", err));
        }
    </script>
</body>
</html>
