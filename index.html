// ── UTILS ────────────────────────────────────────────────────
const fmtT = d=>{try{const dt=d?.toDate?d.toDate():new Date(d);return dt.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});}catch{return"";}};
const fmtD = d=>{try{const dt=d?.toDate?d.toDate():new Date(d);const diff=new Date()-dt;if(diff<86400000)return fmtT(d);if(diff<172800000)return"Kemarin";return dt.toLocaleDateString("id-ID",{day:"2-digit",month:"short"});}catch{return"";}};
const ini  = n=>(n||"?").split(" ").map(x=>x[0]).join("").toUpperCase().slice(0,2);
const abg  = (n,th)=>{const c=[th.pri,th.acc,th.priD];return c[(n||"A").charCodeAt(0)%c.length];};
const normPhone = p=>{
  // Simpan apa adanya setelah hapus spasi/strip
  return p.replace(/[\s\-().]/g,"").trim();
};
const allPhoneFormats = p=>{
  // Kembalikan semua kemungkinan format nomor yang sama
  let n=p.replace(/[\s\-().+]/g,"").trim();
  const formats=new Set();
  formats.add(n);
  if(n.startsWith("62")){formats.add("0"+n.slice(2));formats.add("+"+n);}
  else if(n.startsWith("08")){formats.add("62"+n.slice(1));formats.add("+62"+n.slice(1));formats.add(n);}
  else if(n.startsWith("8")&&n.length>=9){formats.add("0"+n);formats.add("62"+n);formats.add("+62"+n);}
  return Array.from(formats);
};
const chatId = (a,b)=>[a,b].sort().join("_");

// ── FIREBASE OPS ─────────────────────────────────────────────
async function saveUser(uid,data){
  const {doc,setDoc}=window._fs;
  await setDoc(doc(window._db,"users",uid),data,{merge:true});
}
async function getUser(uid){
  const {doc,getDoc}=window._fs;
  const s=await getDoc(doc(window._db,"users",uid));
  return s.exists()?{uid,...s.data()}:null;
}
async function findUserByPhone(phone){
  const {collection,query,where,getDocs}=window._fs;
  const formats=allPhoneFormats(phone);
  for(const fmt of formats){
    const q=query(collection(window._db,"users"),where("phone","==",fmt));
    const s=await getDocs(q);
    if(!s.empty){const d=s.docs[0];return{uid:d.id,...d.data()};}
  }
  return null;
}
async function uploadAvatar(uid,dataUrl){
  if(!dataUrl||!dataUrl.startsWith("data:"))return dataUrl;
  const {ref,uploadString,getDownloadURL}=window._fs;
  const r=ref(window._st,`avatars/${uid}.jpg`);
  await uploadString(r,dataUrl,"data_url");
  return getDownloadURL(r);
}
async function uploadChatImg(cid,dataUrl){
  if(!dataUrl||!dataUrl.startsWith("data:"))return dataUrl;
  const {ref,uploadString,getDownloadURL}=window._fs;
  const r=ref(window._st,`chats/${cid}/${Date.now()}.jpg`);
  await uploadString(r,dataUrl,"data_url");
  return getDownloadURL(r);
}
async function sendMessage(cid,msg){
  const {collection,addDoc,serverTimestamp}=window._fs;
  await addDoc(collection(window._db,"chats",cid,"messages"),{...msg,time:serverTimestamp()});
}
async function updateOnline(uid,online){
  try{
    const {doc,updateDoc,serverTimestamp}=window._fs;
    await updateDoc(doc(window._db,"users",uid),{online,lastSeen:serverTimestamp()});
  }catch(e){}
}

// ── SETUP PROFILE ────────────────────────────────────────────
function Setup({th,s,initUser,onDone}){
  const [name,setName]=useState(initUser?.name||"");

  const pick=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setAv(ev.target.result);r.readAsDataURL(f);};

  const save=async()=>{
    if(!name.trim()){setErr(s.nameRequired);return;}

// ── FIND USER ────────────────────────────────────────────────

  const search=async()=>{
    if(!q.trim())return;
    setLoading(true);setResult(null);setNotFound(false);
    try{
      const phone=normPhone(q);
      if(phone===me.phone){setNotFound(true);setLoading(false);return;}
      const u=await findUserByPhone(phone);
      if(u)setResult(u);
      else setNotFound(true);
    }catch(e){setNotFound(true);}

// ── MAIN APP ────────────────────────────────────────────────
function App(){
  const [screen,setScreen] = useState("splash");
  const [thName,setThName] = useState(()=>localStorage.getItem("vt_th")||"soft");
  const [lang,setLang]     = useState(()=>localStorage.getItem("vt_lang")||"id");
  const [autoTh,setAutoTh] = useState(()=>localStorage.getItem("vt_auto")==="1");
  const [me,setMe]         = useState(null);
  const [contacts,setContacts] = useState([]);
  const [lastMsgs,setLastMsgs] = useState({});
  const [unread,setUnread]   = useState({});
  const [active,setActive]   = useState(null);
  const [fwdMsg,setFwdMsg]   = useState(null);
  const [fbOk,setFbOk]       = useState(false);

  const dark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
  const th = (autoTh&&dark&&thName!=="elegant") ? {...TH[thName],bg:"#1A0A2E",bg2:"#250F3F",surf:"#1E0D35",surf2:"#2A1445",txt:"#F0E6FF",txm:"#9B7EC8",bdr:"#3D2060"} : TH[thName];
  const s = S[lang];

  // Init
  useEffect(()=>{
    const init=async()=>{
      // Wait for Firebase
      if(window._fbOk){setFbOk(true);}
      else{
        await new Promise(res=>{
          window.addEventListener("fbOk",()=>{setFbOk(true);res();},{once:true});
          setTimeout(res,5000); // fallback
        });
      }
      // Check saved profile
      const uid=localStorage.getItem("vt_uid");
      const prof=localStorage.getItem("vt_prof");
      if(uid&&prof){
        try{
          const p=JSON.parse(prof);
          setMe(p);
          // Try update from Firestore
          if(window._fbOk){
            const fresh=await getUser(uid);
            if(fresh){setMe(fresh);localStorage.setItem("vt_prof",JSON.stringify(fresh));}
            updateOnline(uid,true);
          }
          setScreen("chats");
        }catch(e){setScreen("setup");}
      } else {
        setScreen("setup");
      }
    };
    const ti=setTimeout(init,2000);
    return()=>clearTimeout(ti);
  },[]);

  // Online status
  useEffect(()=>{
    if(!me||!fbOk)return;
    updateOnline(me.uid,true);
    const handler=()=>updateOnline(me.uid,false);
    window.addEventListener("beforeunload",handler);
    const interval=setInterval(()=>updateOnline(me.uid,true),60000);
    return()=>{window.removeEventListener("beforeunload",handler);clearInterval(interval);};
  },[me,fbOk]);

  // Listen contacts & last messages
  useEffect(()=>{
    if(!me||!fbOk)return;
    // Load saved contacts
    const saved=localStorage.getItem("vt_contacts");
    if(saved){try{setContacts(JSON.parse(saved));}catch(e){}}

    // Listen last messages for each contact
    const savedContacts=saved?JSON.parse(saved):[];
    const unsubs=[];
    savedContacts.forEach(c=>{
      const cid=chatId(me.uid,c.uid);
      const {collection,query,orderBy,onSnapshot}=window._fs;
      const q=query(collection(window._db,"chats",cid,"messages"),orderBy("time","desc"));
      const unsub=onSnapshot(q,snap=>{
        if(!snap.empty){
          const last=snap.docs[0].data();
          setLastMsgs(prev=>({...prev,[c.uid]:last}));
          // Count unread
          const unreadCount=snap.docs.filter(d=>{const m=d.data();return m.toUid===me.uid&&!m.read&&!m.deleted;}).length;
          setUnread(prev=>({...prev,[c.uid]:unreadCount}));
        }
      });
      unsubs.push(unsub);
    });
    return()=>unsubs.forEach(u=>u());
  },[me,fbOk]);

  // Handle back button
  useEffect(()=>{
    const handler=e=>{
      e.preventDefault();
      if(screen==="chat"){setScreen("chats");return;}
      if(screen==="newchat"||screen==="settings"||screen==="profile"){setScreen(screen==="profile"?"settings":"chats");return;}
      // Prevent exit on chats screen
    };
    window.addEventListener("popstate",handler);
    window.history.pushState(null,"",window.location.href);
    return()=>window.removeEventListener("popstate",handler);
  },[screen]);

  const openChat=c=>{
    // Mark messages as read
    if(fbOk){
      const {collection,query,where,getDocs,doc,updateDoc}=window._fs;
      const q=query(collection(window._db,"chats",chatId(me.uid,c.uid),"messages"),where("toUid","==",me.uid),where("read","==",false));
      getDocs(q).then(snap=>snap.docs.forEach(d=>updateDoc(doc(window._db,"chats",chatId(me.uid,c.uid),"messages",d.id),{read:true})));
    }
    setUnread(prev=>({...prev,[c.uid]:0}));
    setActive(c);setScreen("chat");
  };

  const addContact=c=>{
    const existing=contacts.find(x=>x.uid===c.uid);
    if(!existing){
      const updated=[...contacts,c];
      setContacts(updated);
      localStorage.setItem("vt_contacts",JSON.stringify(updated));
    }
    openChat(c);
  };

  const handleTheme=k=>{setThName(k);localStorage.setItem("vt_th",k);};
  const handleLang=l=>{setLang(l);localStorage.setItem("vt_lang",l);};
  const handleAuto=()=>setAutoTh(v=>{localStorage.setItem("vt_auto",v?"0":"1");return!v;});

  const logout=()=>{
    if(me&&fbOk)updateOnline(me.uid,false);
    localStorage.removeItem("vt_uid");
    localStorage.removeItem("vt_prof");
    localStorage.removeItem("vt_contacts");
    setMe(null);setContacts([]);setScreen("setup");
  };

  return React.createElement(React.Fragment,null,
    screen==="splash"   && React.createElement(Splash,{th,s}),
    screen==="setup"    && React.createElement(Setup,{th,s,initUser:me,onDone:p=>{setMe(p);setScreen("chats");}}),
    screen==="chats"    && me && React.createElement(ChatList,{th,s,me,contacts,lastMsgs,unreadCounts:unread,onOpen:openChat,onNew:()=>setScreen("newchat"),onSettings:()=>setScreen("settings")}),
    screen==="newchat"  && me && React.createElement(FindUser,{th,s,me,contacts,onSelect:addContact,onBack:()=>setScreen("chats")}),
    screen==="chat"     && active && me && React.createElement(ChatRoom,{th,s,me,contact:active,onBack:()=>setScreen("chats"),contacts,onForwardOpen:msg=>{setFwdMsg(msg);}}),
    screen==="settings" && me && React.createElement(Settings,{th,s,me,curTh:thName,lang,autoTh,onTh:handleTheme,onLang:handleLang,onAuto:handleAuto,onLogout:logout,onBack:()=>setScreen("chats"),onEdit:()=>setScreen("profile")}),
    screen==="profile"  && me && React.createElement(Setup,{th,s,initUser:me,onDone:p=>{setMe(p);localStorage.setItem("vt_prof",JSON.stringify(p));setScreen("settings");}}),
    // Forward modal
    fwdMsg&&React.createElement("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"},onClick:()=>setFwdMsg(null)},
      React.createElement("div",{style:{background:th.surf,borderRadius:"24px 24px 0 0",padding:24,width:"100%",maxWidth:480,maxHeight:"60vh",overflowY:"auto"},onClick:e=>e.stopPropagation()},
        React.createElement("h3",{style:{margin:"0 0 16px",color:th.txt,fontFamily:th.fontD}},s.forwardTo),
        contacts.filter(c=>c.uid!==active?.uid).map(c=>
          React.createElement("div",{key:c.uid,onClick:async()=>{
            if(active&&me){
              const msg={text:fwdMsg.text||"",image:fwdMsg.image||null,fromUid:me.uid,toUid:c.uid,read:false,deleted:false,replyTo:null};
              await sendMessage(chatId(me.uid,c.uid),msg);
            }
            setFwdMsg(null);
          },style:{display:"flex",alignItems:"center",gap:12,padding:"10px 0",cursor:"pointer",borderBottom:`1px solid ${th.bdr}`}},
            React.createElement(Av,{u:c,th,size:40}),
            React.createElement("p",{style:{margin:0,fontWeight:700,color:th.txt}},c.name)
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>

<!-- Service Worker + Notifikasi -->
<script>
(async()=>{
  if(!("serviceWorker" in navigator)) return;
  try{
    // Register SW dari file sw.js
    const reg = await navigator.serviceWorker.register("/Talks/sw.js", {scope:"/Talks/"});
    window._swReg = reg;
    console.log("SW registered");
    
    // Minta izin notifikasi
    if(Notification.permission === "default"){
      const perm = await Notification.requestPermission();
      console.log("Notif permission:", perm);
    }
    window._notifOk = Notification.permission === "granted";
  }catch(e){
    console.log("SW error:", e);
    // Fallback: blob SW
    try{
      const sw=`
        const C="vt-v4";
        self.addEventListener("install",e=>{self.skipWaiting();});
        self.addEventListener("activate",e=>{self.clients.claim();});
        self.addEventListener("fetch",e=>{
          if(e.request.method!=="GET"||e.request.url.includes("firebase"))return;
          e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request)));
        });
      `;
      const blob=new Blob([sw],{type:"application/javascript"});
      await navigator.serviceWorker.register(URL.createObjectURL(blob));
    }catch(e2){}
  }
})();

// Fungsi kirim notifikasi lokal
window.showNotif = (title, body, icon) => {
  if(!window._notifOk) return;
  if(document.visibilityState === "visible") return; // Jangan notif kalau app sedang dibuka
  try{
    if(window._swReg){
      window._swReg.showNotification(title, {
        body, icon: icon || "/Talks/icon-192.png",
        badge: "/Talks/icon-192.png",
        vibrate: [200, 100, 200],
        tag: "vena-msg",
        renotify: true,
      });
    } else {
      new Notification(title, {body, icon: icon || "/Talks/icon-192.png"});
    }
  }catch(e){}
};
</script>
